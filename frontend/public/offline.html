<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline · Rehoboth International Ministries</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9ff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0d" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8f9ff;
        --fg: #0b1c30;
        --muted: #5b6472;
        --tile: #7c3aed;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0d;
          --fg: #f2f2f7;
          --muted: #9a9aa8;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem calc(1.5rem + env(safe-area-inset-right)) 2rem calc(1.5rem + env(safe-area-inset-left));
        background: var(--bg);
        color: var(--fg);
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      .tile {
        width: 56px; height: 56px; margin: 0 auto 1.5rem;
        border-radius: 14px; background: var(--tile); color: #fff;
        display: grid; place-items: center;
        font: 500 13px/1 ui-monospace, 'JetBrains Mono', monospace;
        letter-spacing: 0.08em;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.375rem; font-weight: 700; letter-spacing: -0.01em; }
      p { margin: 0 auto; max-width: 30rem; color: var(--muted); font-size: 0.9375rem; line-height: 1.6; }
      button {
        margin-top: 1.75rem; padding: 0.75rem 1.5rem; border: 0; border-radius: 999px;
        background: var(--tile); color: #fff; font: inherit; font-size: 0.875rem; font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="tile">RIM</div>
      <h1>You&rsquo;re offline</h1>
      <p>
        This page hasn&rsquo;t been opened on this device yet, so there&rsquo;s nothing saved to show.
        Reconnect and it will load — anything you&rsquo;ve already visited stays available offline.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
