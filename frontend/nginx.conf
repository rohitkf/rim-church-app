server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fingerprinted build assets are immutable; cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The worker controls the whole origin and must never be served stale,
    # or a bad build would pin itself in place on every installed device.
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # SPA fallback: unknown paths resolve to index.html so React Router's
    # client-side routes work on a hard refresh / direct link.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
