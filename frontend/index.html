<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the app paint into the notch and home-bar
         areas on iOS; the shell pads itself back out with env(safe-area-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Installed app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="application-name" content="RIM" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RIM" />
    <!-- The status bar tints itself from theme-color on Android and from
         the page behind it on iOS, so both follow the user's theme. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta
      name="description"
      content="Service planning, rotas, checklists and team coordination for Rehoboth International Ministries."
    />

    <!-- No webfonts: the app is set in the device's own face (index.css),
         so there is nothing to fetch from anyone before the first paint. -->
    <title>Rehoboth International Ministries</title>
  </head>
  <body>
    <!-- Something to look at while the bundle parses, and — more to the
         point — something that is still on screen if it never does. A blank
         page says nothing; this says what is happening, and after ten
         seconds says that it hasn't. React replaces all of it on mount. -->
    <div id="root">
      <div id="boot" style="
        display:flex; min-height:100svh; align-items:center; justify-content:center;
        padding:1.5rem; text-align:center;
        font:500 0.875rem/1.5 -apple-system, BlinkMacSystemFont, ui-sans-serif, system-ui, sans-serif;
        color:#6b7280;
      ">
        <div>
          <div id="boot-msg">Loading&hellip;</div>
          <noscript style="display:block; margin-top:0.5rem">
            This app needs JavaScript switched on.
          </noscript>
        </div>
      </div>
    </div>
    <script>
      // Only ever seen when the bundle failed to load or run: React clears
      // #root long before this fires on any normal visit.
      window.setTimeout(function () {
        var el = document.getElementById('boot-msg')
        if (!el) return
        el.innerHTML =
          'The app is taking longer than it should to start.<br>' +
          '<a href="/" style="color:inherit" onclick="location.reload();return false">Try again</a>'
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
