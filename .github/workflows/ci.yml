name: CI

on:
  push:
    # develop is where work lands and Vercel builds previews from; main is
    # production, reached by pull request. Nothing else is long-lived.
    branches: [main, develop]
  pull_request:

# CI only reads the checkout: it consumes no secret and writes nothing back.
# The token it holds is read-only whatever the repository's default says.
permissions:
  contents: read

# A newer push to the same branch, or to the same pull request, makes the
# run still going for the old one pointless: stop it. The push run and the
# pull request run have different refs, so they never cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# How long this takes is how long a merge to main waits before it deploys,
# so the slow part — 240-odd test files, three minutes in one job — is
# split four ways, and the jobs that only matter when their own files
# change (the AI backend, the Docker images) are skipped otherwise. A
# skipped job still reports, as skipped, which auto-merge counts as green.
# Every job keeps its old name.

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      docker: ${{ steps.diff.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -e
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$PR_BASE...$PR_HEAD")
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$AFTER")
          else
            # A new branch, or a history we cannot see: check everything.
            echo "backend=true" >> "$GITHUB_OUTPUT"; echo "docker=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          # A change to CI itself runs everything, so the workflow is tested.
          any() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          echo "backend=$(any '^(backend/|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "docker=$(any '^(backend/|frontend/(Dockerfile|nginx[^/]*|\.dockerignore)$|docker-compose\.yml$|\.env\.example$|\.github/workflows/)')" >> "$GITHUB_OUTPUT"

  # Lint, the type checks and the production build: everything but the tests.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  frontend-tests:
    name: frontend tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/4

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations against a bare Postgres instance
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          psql -h localhost -U postgres -c "create database church_ci;"
          for f in supabase/_local_test/*.sql supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U postgres -d church_ci -v ON_ERROR_STOP=1 -f "$f"
          done

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: church-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: church-frontend:ci
          build-args: |
            VITE_SUPABASE_URL=https://placeholder.supabase.co
            VITE_SUPABASE_ANON_KEY=placeholder
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          rm .env
