name: CI

on:
  push:
    # develop is where work lands and Vercel builds previews from; main is
    # production, reached by pull request. Nothing else is long-lived.
    branches: [main, develop]
  pull_request:

# CI only reads the checkout: it consumes no secret and writes nothing back.
# The token it holds is read-only whatever the repository's default says.
permissions:
  contents: read

# A newer push to the same branch, or to the same pull request, makes the
# run still going for the old one pointless: stop it. The push run and the
# pull request run have different refs, so they never cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# How long this takes is how long a merge to main waits before it deploys,
# so the slow part — 240-odd test files, three minutes in one job — is
# split four ways, and the jobs that only matter when their own files
# change (the AI backend, the Docker images, the packages' known
# vulnerabilities) are skipped otherwise. A skipped job still reports, as
# skipped, which auto-merge counts as green. Every job keeps its old name.

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      docker: ${{ steps.diff.outputs.docker }}
      deps: ${{ steps.diff.outputs.deps }}
      functions: ${{ steps.diff.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -e
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$PR_BASE...$PR_HEAD")
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$AFTER")
          else
            # A new branch, or a history we cannot see: check everything.
            echo "backend=true" >> "$GITHUB_OUTPUT"; echo "docker=true" >> "$GITHUB_OUTPUT"; echo "deps=true" >> "$GITHUB_OUTPUT"; echo "functions=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          # A change to CI itself runs everything, so the workflow is tested.
          any() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          echo "backend=$(any '^(backend/|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "docker=$(any '^(backend/|frontend/(Dockerfile|nginx[^/]*|\.dockerignore)$|docker-compose\.yml$|\.env\.example$|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "deps=$(any '^(frontend/package(-lock)?\.json$|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "functions=$(any '^(supabase/functions/|\.github/workflows/)')" >> "$GITHUB_OUTPUT"

  # Lint, the type checks and the production build: everything but the tests.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  frontend-tests:
    name: frontend tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/4

  # Known vulnerabilities in what the app is built from, high and worse.
  # Only when the packages themselves change (or CI does): a change to the
  # packages has to come in clean, but an advisory published on a Saturday
  # night must not turn Sunday morning's unrelated fix red. What is
  # published later is the weekly run's to find (dependency-audit.yml),
  # and Dependabot's to mend.
  dependencies:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high

  # The edge functions, as Deno reads them: every import fetched at the
  # exact version it names, and the types checked. Nothing else here runs
  # them — the app's tests are Node — and deploying does not check types,
  # so a function could be deployed with a mistake only its first caller
  # would find. Deno's own version is pinned too, and moved by hand.
  functions:
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.5.4
      - run: deno check --no-lock supabase/functions/*/index.ts

  # A release may not go out ahead of its database. The app is built
  # knowing the migration it needs (frontend/src/lib/schemaNeeds.ts) and
  # production says which it has reached (/api/health, from the ledger of
  # 0285). The house rule — apply the migration, then open the pull
  # request — was kept by hand, and this pull request merges and deploys
  # itself: the day the order slipped, every phone was told "Could not
  # find the table". Now a release that is ahead fails here, in words, and
  # waits; apply the migration and re-run this job.
  #
  # Only on a pull request into main: that is the release. And only a
  # clear, lower number stops it — a production that cannot be asked must
  # not hold up the fix it is waiting for.
  database:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production has reached the migration this release needs
        env:
          SITE: https://rim-church-app.vercel.app
        run: |
          needs=$(sed -n 's/^export const SCHEMA_NEEDS = \([0-9][0-9]*\)$/\1/p' frontend/src/lib/schemaNeeds.ts)
          if [ -z "$needs" ]; then
            echo "::error::Could not read SCHEMA_NEEDS from frontend/src/lib/schemaNeeds.ts."
            exit 1
          fi
          answer=$(curl -sS --max-time 25 "$SITE/api/health" 2>/dev/null || true)
          has=$(printf '%s' "$answer" | sed -n 's/.*"schema":\([0-9][0-9]*\)[,}].*/\1/p')
          if [ -z "$has" ]; then
            echo "::warning::Production did not say which migration it has reached, so this release is not held on a question that could not be asked. It needs $needs. What came back: $(printf '%s' "$answer" | head -c 200)"
            exit 0
          fi
          if [ "$has" -lt "$needs" ]; then
            echo "::error::Production's database is at migration $has; this release needs $needs. Apply the migrations up to $needs to production (AGENTS.md §7), then re-run this job. Merging first would show everybody a broken page."
            exit 1
          fi
          echo "Production's database is at migration $has; this release needs $needs."

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # Every migration, in order, on the Postgres that production runs (17:
  # supabase/config.toml says the same). It was 16 until November 2026,
  # so a migration could pass here and behave differently live.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations against a bare Postgres instance
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          psql -h localhost -U postgres -c "create database church_ci;"
          for f in supabase/_local_test/*.sql supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U postgres -d church_ci -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Every SQL function still matches the schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d church_ci -v ON_ERROR_STOP=1 -f supabase/checks/sql_functions_still_match_the_schema.sql

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: church-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: church-frontend:ci
          build-args: |
            VITE_SUPABASE_URL=https://placeholder.supabase.co
            VITE_SUPABASE_ANON_KEY=placeholder
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          rm .env
