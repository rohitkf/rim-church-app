# Merging develop into main once CI says it is safe.
#
# The rule the church works to is that develop is what Vercel previews and
# main is what the congregation actually uses, reached by pull request. That
# gate is worth keeping; sitting on a green pull request for a day is not.
# So this closes the loop: when CI passes on a pull request into main, the
# pull request merges itself.
#
# It runs on `workflow_run` rather than inside CI, because a job that can
# push to main must not be one a pull request can edit: `workflow_run` runs
# the copy of this file that is already on the default branch, whatever the
# branch under test says.
#
# It merges only when every one of these is true, and says which one stopped
# it otherwise:
#   - the pull request is open, not a draft, and targets main
#   - GitHub says it is mergeable with no conflict
#   - every check run on the head commit has finished and none failed
#   - nobody has requested changes
# Put a `do-not-merge` label on a pull request to hold it back by hand.

name: Auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the pull request if everything is green
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run
            const { owner, repo } = context.repo

            // A CI run can carry more than one pull request; each is judged
            // on its own.
            const prs = run.pull_requests?.length
              ? run.pull_requests
              : (await github.rest.pulls.list({
                  owner, repo, state: 'open',
                  head: `${owner}:${run.head_branch}`,
                })).data

            if (prs.length === 0) {
              core.info(`No open pull request for ${run.head_branch}; nothing to merge.`)
              return
            }

            for (const ref of prs) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: ref.number,
              })
              const say = (why) => core.notice(`#${pr.number}: ${why}`)

              if (pr.state !== 'open' || pr.merged) { say('already closed'); continue }
              if (pr.draft) { say('still a draft'); continue }
              if (pr.base.ref !== 'main') { say(`targets ${pr.base.ref}, not main`); continue }
              if (pr.labels.some((l) => l.name === 'do-not-merge')) { say('held by do-not-merge'); continue }
              if (pr.mergeable === false) { say('has a merge conflict'); continue }

              // The CI run that woke this may be stale: judge the head the
              // pull request has now, not the one that was tested.
              if (pr.head.sha !== run.head_sha) { say('head moved since CI ran'); continue }

              const { data: checks } = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha, per_page: 100,
              })
              // This workflow's own run is in flight and would otherwise
              // count as unfinished for ever.
              const others = checks.check_runs.filter((c) => c.name !== context.job)
              const unfinished = others.filter((c) => c.status !== 'completed')
              const failed = others.filter(
                (c) => c.conclusion && !['success', 'neutral', 'skipped'].includes(c.conclusion),
              )
              if (unfinished.length > 0) {
                say(`waiting on ${unfinished.map((c) => c.name).join(', ')}`)
                continue
              }
              if (failed.length > 0) {
                say(`red: ${failed.map((c) => c.name).join(', ')}`)
                continue
              }

              const { data: reviews } = await github.rest.pulls.listReviews({
                owner, repo, pull_number: pr.number, per_page: 100,
              })
              // Only each reviewer's latest word counts: changes requested
              // and then approved is approved.
              const latest = new Map()
              for (const r of reviews) {
                if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state)) {
                  latest.set(r.user.login, r.state)
                }
              }
              if ([...latest.values()].includes('CHANGES_REQUESTED')) {
                say('a reviewer has asked for changes')
                continue
              }

              await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number,
                merge_method: 'merge',
                commit_title: `${pr.title} (#${pr.number})`,
              })
              say('merged')
            }
